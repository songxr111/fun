<canvas id="c" width="400" height="200"></canvas>
<script>let c=document.getElementById('c'),x=c.getContext('2d'),p={x:50,y:150,w:20,h:20,v:0,g:0.5,j:-10},o=[],s=0,sp=5;document.onkeydown=e=>e.code=='Space'&&p.y==150&&(p.v=p.j);function r(){x.fillStyle='#f0f0f0';x.fillRect(0,0,400,200);p.v+=p.g;p.y+=p.v;p.y=Math.min(p.y,150);x.fillStyle='#333';x.fillRect(p.x,p.y,p.w,p.h);Math.random()<0.02&&o.push({x:400,y:150,w:20,h:20});for(let i=o.length-1;i>=0;i--){let t=o[i];t.x-=sp;if(p.x<t.x+t.w&&p.x+p.w>t.x&&p.y<t.y+t.h&&p.y+p.h>t.y){alert('得分: '+s+'\n按确定重玩,加油>-<');o=[];s=0;sp=5;}x.fillRect(t.x,t.y,t.w,t.h);t.x<-20&&o.splice(i,1);}s++;sp=5+s/200;x.fillStyle='#666';x.fillText('得分: '+s,10,20);requestAnimationFrame(r);}r();</script>
