<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小猪佩奇 · 跳泥坑 — ASCII 动画</title>
<style>
  :root { --fg:#7dff7d; --dim:#2f8f3f; --bg:#050a06; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg);
    display: flex; flex-direction: column; align-items: center;
    font-family: Consolas, "Cascadia Mono", Menlo, "Courier New", monospace;
    color: var(--dim);
  }
  h1 { color: var(--fg); font-size: 18px; margin: 18px 0 2px;
       text-shadow: 0 0 8px rgba(125,255,125,.6); font-weight: normal; }
  .sub { font-size: 12px; margin-bottom: 12px; }
  #crt {
    position: relative; border: 1px solid #1c4526; border-radius: 8px;
    padding: 14px 18px; background: radial-gradient(ellipse at center, #07130a 0%, #030704 100%);
    box-shadow: 0 0 24px rgba(50,220,90,.15), inset 0 0 40px rgba(0,0,0,.7);
  }
  #crt::after {
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: 8px;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.16) 0 1px, transparent 1px 3px);
  }
  pre#screen {
    margin: 0; color: var(--fg); font-size: 13px; line-height: 1.12;
    text-shadow: 0 0 6px rgba(125,255,125,.45);
    width: calc(72ch + 2px); height: calc(22 * 13px * 1.12 + 6px);
    overflow: hidden; white-space: pre;
  }
  #bar {
    margin: 14px 0 6px; display: flex; gap: 10px; align-items: center;
    font-size: 12px; flex-wrap: wrap; justify-content: center;
  }
  button, select {
    background: #0a1c0e; color: var(--fg); border: 1px solid #1c4526;
    border-radius: 5px; padding: 4px 12px; font: inherit; cursor: pointer;
  }
  button:hover { background: #12301a; }
  input[type=range] { width: 220px; accent-color: #45d95f; }
  label { display: flex; gap: 4px; align-items: center; cursor: pointer; }
  #count { min-width: 90px; text-align: center; }
  .hint { font-size: 11px; margin: 4px 0 20px; color: #24632f; text-align: center; line-height: 1.7; }
  @media (max-width: 800px) { pre#screen { font-size: 9px; width: calc(72ch + 2px); height: calc(22 * 9px * 1.12 + 6px);} }
</style>
</head>

<h1>小猪佩奇 第一集《跳泥坑》</h1>
<div class="sub">Muddy Puddles · 原创 ASCII 同人动画 · 致敬 telnet 星球大战</div>
<div id="crt"><pre id="screen"></pre></div>
<div id="bar">
  <button id="btnPlay">⏸ 暂停</button>
  <button id="btnRestart">↺ 重放</button>
  <select id="speed">
    <option value="0.5">0.5x</option>
    <option value="1" selected>1x</option>
    <option value="1.5">1.5x</option>
    <option value="2">2x</option>
  </select>
  <input type="range" id="seek" min="0" max="0" value="0">
  <span id="count">0 / 0</span>
  <label><input type="checkbox" id="loop" checked>循环</label>
</div>
<div class="hint">空格 = 播放/暂停 · ←/→ = 前后一帧<br>

</script>
<script>
(function () {
  var HEIGHT = 22, TICK = 100; // ms per tick
  var raw = document.getElementById('frames').textContent.split('\n');
  var frames = [];
  var i = 0;
  while (i < raw.length && raw[i].trim() === '') i++;
  while (i < raw.length) {
    var line = raw[i].trim();
    if (!line || isNaN(parseInt(line, 10))) break;
    var t = parseInt(line, 10);
    var rows = raw.slice(i + 1, i + 1 + HEIGHT);
    if (rows.length < HEIGHT) break;
    frames.push([t, rows.join('\n')]);
    i += 1 + HEIGHT;
  }

  var screen = document.getElementById('screen');
  var btnPlay = document.getElementById('btnPlay');
  var btnRestart = document.getElementById('btnRestart');
  var speedSel = document.getElementById('speed');
  var seek = document.getElementById('seek');
  var count = document.getElementById('count');
  var loopBox = document.getElementById('loop');

  var idx = 0, playing = true, timer = null;
  seek.max = String(frames.length - 1);

  function draw() {
    screen.textContent = frames[idx][1];
    seek.value = String(idx);
    count.textContent = (idx + 1) + ' / ' + frames.length;
  }
  function schedule() {
    clearTimeout(timer);
    if (!playing) return;
    var speed = parseFloat(speedSel.value) || 1;
    timer = setTimeout(step, frames[idx][0] * TICK / speed);
  }
  function step() {
    if (idx + 1 >= frames.length) {
      if (loopBox.checked) idx = 0;
      else { setPlaying(false); return; }
    } else idx++;
    draw();
    schedule();
  }
  function setPlaying(p) {
    playing = p;
    btnPlay.textContent = p ? '⏸ 暂停' : '▶ 播放';
    if (p) schedule(); else clearTimeout(timer);
  }
  btnPlay.onclick = function () { setPlaying(!playing); };
  btnRestart.onclick = function () { idx = 0; draw(); setPlaying(true); };
  speedSel.onchange = schedule;
  seek.oninput = function () { idx = parseInt(seek.value, 10) || 0; draw(); schedule(); };
  document.addEventListener('keydown', function (e) {
    if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight') { idx = Math.min(frames.length - 1, idx + 1); draw(); }
    else if (e.key === 'ArrowLeft') { idx = Math.max(0, idx - 1); draw(); }
  });

  if (frames.length) { draw(); schedule(); }
  else screen.textContent = 'no frames?!';
})();
</script>
